<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشجرة الجد الجامع — التحكم الكامل</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial;background:#faf6ee}

  /* ---- زر فتح/إغلاق اللوحة المنسدلة ---- */
  #drawerToggle{
    position:fixed; top:14px; left:14px; z-index:12;
    background:#8a6d1f; color:#f3ecd8; border:0; border-radius:50%;
    width:46px; height:46px; font-size:20px; cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center;
    transition:transform .25s ease, background .2s ease;
  }
  #drawerToggle:hover{background:#a8863a}
  #drawerToggle.open{transform:rotate(90deg)}

  /* ---- اللوحة المنسدلة (أجمل: بطاقة عائمة بحركة سلسة) ---- */
  #panel{
    position:fixed; top:14px; left:14px; z-index:11;
    width:340px; max-width:88vw; max-height:0; opacity:0;
    background:#fffdf7; color:#3a2a1a; border-radius:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.28);
    overflow:hidden;
    transition:max-height .35s cubic-bezier(.2,.8,.2,1), opacity .25s ease, padding .35s ease;
    padding:0 18px;
  }
  #panel.open{ max-height:80vh; opacity:1; padding:64px 18px 18px; overflow-y:auto; }
  #panel h3{margin:0 0 10px;font-size:15px;color:#8a6d1f;border-bottom:2px solid #eee0c0;padding-bottom:6px}
  .row{display:flex;align-items:center;gap:10px;padding:6px 0}
  .row.sub label{width:150px;font-weight:normal;font-size:11.5px;color:#5a4a30}
  .row label{width:180px;font-size:13px;flex-shrink:0;font-weight:bold;color:#4a3a10}
  .row input[type=range]{flex:1;accent-color:#8a6d1f}
  .val{min-width:38px;text-align:center;font-weight:bold;background:#f3ecd8;color:#4a3a10;
        border-radius:5px;padding:2px 6px;font-size:11.5px}
  #master-off{background:#f3ecd8;margin:6px -18px;padding:8px 18px;border-radius:0}
  h4{margin:14px 0 2px;font-size:13px;color:#8a6d1f;border-top:1px solid #eee0c0;padding-top:10px}

  /* ---- شريط التدوير: عمودي، ثابت، منتصف الشاشة، أقصى اليمين ---- */
  #rotatePanel{
    position:fixed; top:50%; left:14px; transform:translateY(-50%);
    z-index:11; display:flex; flex-direction:column; align-items:center; gap:8px;
    background:#fffdf7; border-radius:16px; padding:14px 10px;
    box-shadow:0 8px 26px rgba(0,0,0,.25);
  }
  #rotatePanel .lbl{font-size:11px;font-weight:bold;color:#8a6d1f;writing-mode:vertical-rl;text-orientation:mixed}
  #rotatePanel input[type=range]{
    writing-mode:vertical-lr; direction:rtl;
    width:8px; height:200px; accent-color:#8a6d1f;
  }
  #rotatePanel .val{background:#8a6d1f;color:#f3ecd8}

  #canvas-wrap{width:100%;height:100vh;overflow:auto}
  #scrollSpacer{display:flex;align-items:center;justify-content:center;flex-shrink:0}
  #rotateWrap{transform-origin:center center;transition:transform .05s linear;flex-shrink:0;display:flex}
  #zoomWrap{flex-shrink:0}
  svg{max-width:none}

  #zoomButtons{
    position:fixed; bottom:20px; left:20px; z-index:11;
    display:flex; flex-direction:column; gap:8px;
  }
  #zoomButtons button{
    width:46px; height:46px; border-radius:50%; border:0;
    background:#8a6d1f; color:#f3ecd8; font-size:24px; font-weight:bold;
    cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center;
    transition:background .2s ease;
  }
  #zoomButtons button:hover{background:#a8863a}
  #zoomButtons button:active{background:#6b5316}

#chainOverlay{
  position:fixed; inset:0; z-index:100;
  background:rgba(40,30,10,0.35);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:none; align-items:center; justify-content:center;
}
#chainOverlay.show{ display:flex; }
#chainBox{
  background:#faf6ee; border-radius:18px; padding:20px 30px;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
  transform:scale(0.15); opacity:0;
  transition:transform .38s cubic-bezier(.2,.8,.2,1), opacity .3s ease;
  max-height:85vh; overflow:auto;
}
#chainOverlay.show #chainBox{ transform:scale(1); opacity:1; }
#chainSvg{ width:360px; max-width:85vw; height:auto; display:block; }

/* ===== PERSON CARD LINK FEATURE START (قراءة فقط من Firestore) ===== */
#pInfoOverlay{
  position:fixed; inset:0; z-index:200;
  background:rgba(20,15,5,0.55);
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; padding:16px;
}
#pInfoOverlay.show{ display:flex; }
#pInfoCard{
  width:420px; max-width:100%; max-height:88vh; overflow-y:auto;
  background:#FFFDF6; border-radius:18px; border:1.6px solid #B8860B;
  box-shadow:0 16px 50px rgba(0,0,0,.4);
  font-family:'Tajawal',sans-serif;
  transform:scale(.9); opacity:0;
  transition:transform .25s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
}
#pInfoOverlay.show #pInfoCard{ transform:scale(1); opacity:1; }
#pInfoHeader{
  background:linear-gradient(135deg,#0B3D2E,#12503C); color:#fff;
  padding:18px 20px 14px; border-radius:16px 16px 0 0; border-bottom:3px solid #C9A227; position:relative;
}
#pInfoClose{
  position:absolute; top:10px; left:14px; width:30px; height:30px; border-radius:50%;
  background:rgba(255,255,255,.15); color:#fff; border:none; font-size:16px; cursor:pointer;
}
#pInfoName{ font-family:'Amiri',serif; font-size:22px; font-weight:700; margin:0 0 6px; }
#pInfoChain{ font-size:11.5px; color:#cfe6da; line-height:1.7; }
#pInfoBody{ padding:16px 20px 22px; }
#pInfoBody .pi-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #F0EAD8; font-size:14px; }
#pInfoBody .pi-label{ color:#8B4A1E; font-weight:700; }
#pInfoBody .pi-value{ color:#222; }
#pInfoBody .pi-section-title{ font-size:13px; font-weight:700; color:#0B3D2E; margin:14px 0 6px; display:flex; align-items:center; gap:8px; }
#pInfoBody .pi-section-title::before, #pInfoBody .pi-section-title::after{ content:""; flex:1; height:1px; background:#E6D9B8; }
#pInfoBody .pi-sadaha-item{ background:#F7F2E2; border-radius:9px; padding:8px 12px; margin:5px 0; font-size:13px; color:#333; }
#pInfoBody .pi-sadaha-item b{ color:#8B4A1E; }
#pInfoBody .pi-rel{ color:#5a4a2a; font-weight:600; font-size:12.5px; }
#pInfoBody .pi-bio{ font-size:13.5px; color:#333; line-height:1.9; white-space:pre-line; margin-top:4px; }
#pInfoLoading{ padding:40px 20px; text-align:center; color:#8a7550; font-size:14px; }
/* ===== PERSON CARD LINK FEATURE END ===== */

</style>
<!-- ===== PERSON CARD LINK FEATURE START (قراءة فقط من Firestore — بلا أي كتابة) ===== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- ===== PERSON CARD LINK FEATURE END ===== -->
</head>
<body>
<button id="drawerToggle" onclick="toggleDrawer()">⚙</button>
<div id="panel">
  <h3>إعدادات المشجرة</h3>
  <div class="row"><label>التباعد بين الأجيال:</label>
    <input type="range" id="ringSlider" min="60" max="400" value="175" step="5">

      <label>مسافة النص - جيل 3:</label>
      <input type="range" class="offSlider" data-depth="2" min="-5" max="150" value="70" step="1">
      <span class="val" data-off-val="2">70</span>
    </div>
    <div class="row sub">
      <label>مسافة النص - جيل 4:</label>
      <input type="range" class="offSlider" data-depth="3" min="-5" max="150" value="70" step="1">
      <span class="val" data-off-val="3">70</span>
    </div>
    <div class="row sub">
      <label>مسافة النص - جيل 5:</label>
      <input type="range" class="offSlider" data-depth="4" min="-5" max="150" value="70" step="1">
      <span class="val" data-off-val="4">70</span>
    </div>
    <div class="row sub">
      <label>مسافة النص - جيل 6:</label>
      <input type="range" class="offSlider" data-depth="5" min="-5" max="150" value="70" step="1">
      <span class="val" data-off-val="5">70</span>
    </div>
    <div class="row sub">
      <label>مسافة النص - جيل 7:</label>
      <input type="range" class="offSlider" data-depth="6" min="-5" max="150" value="70" step="1">
      <span class="val" data-off-val="6">70</span>
    </div>
    <div class="row sub">
      <label>مسافة النص - جيل 8:</label>
      <input type="range" class="offSlider" data-depth="7" min="-5" max="150" value="70" step="1">
      <span class="val" data-off-val="7">70</span>
    </div>
</div>

<div id="rotatePanel">
  <span class="val" id="rotateVal">0°</span>
  <input type="range" id="rotateSlider" min="0" max="360" value="0" step="1">
  <span class="lbl">تدوير الخريطة</span>
</div>

<div id="zoomButtons">
  <button id="zoomIn" onclick="changeZoom(0.15)">+</button>
  <button id="zoomOut" onclick="changeZoom(-0.15)">−</button>
</div>

<div id="canvas-wrap">
<div id="scrollSpacer">
<div id="rotateWrap">
<div id="zoomWrap">

    const a = ANGLES[g.dataset.nid], r = radiusFor(parseInt(g.dataset.d));
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(a*180/Math.PI).toFixed(1)})`);
  });
  document.querySelectorAll('text.lbl').forEach(t => {
    const rad = parseFloat(t.dataset.rad);
    const d = parseInt(t.dataset.depthLbl);
    t.setAttribute('x', (rad + OFF[d]).toFixed(1));
  });
  const RIM = JP_R + MAXD*RING + 30;
  document.querySelectorAll('.divider').forEach(l => {
    const a = parseFloat(l.dataset.a);
    l.setAttribute('x1', (Math.cos(a)*JP_R).toFixed(1));
    l.setAttribute('y1', (Math.sin(a)*JP_R).toFixed(1));
    l.setAttribute('x2', (Math.cos(a)*(RIM+40)).toFixed(1));
    l.setAttribute('y2', (Math.sin(a)*(RIM+40)).toFixed(1));
  });
  document.querySelectorAll('.badge').forEach(g => {
    const am = parseFloat(g.dataset.am), br = RIM + 165;
    g.setAttribute('transform', `translate(${(Math.cos(am)*br).toFixed(1)},${(Math.sin(am)*br).toFixed(1)})`);
  });
  const SZ = RIM + 320;
  document.getElementById('mainsvg').setAttribute('viewBox', `${-SZ} ${-SZ} ${SZ*2} ${SZ*2}`);
}

let zoomLevel = 1.6;
const ZOOM_MIN = 0.05, ZOOM_MAX = 5.0;
const SVG_NATIVE_SIZE = 3800; // نفس قيمة width/height الأصلية لعنصر svg

let currentRotateDeg = 0;

function updateScrollSpacer(){
  const size = SVG_NATIVE_SIZE * zoomLevel;
  const rad = currentRotateDeg * Math.PI/180;
  // صندوق الإحاطة الحقيقي لمربع مُدار بزاوية rad
  const bbox = size * (Math.abs(Math.cos(rad)) + Math.abs(Math.sin(rad)));
  const spacer = document.getElementById('scrollSpacer');
  spacer.style.width = bbox + 'px';
  spacer.style.height = bbox + 'px';
}

function applyZoom(){
  const svgEl = document.getElementById('mainsvg');
  const size = SVG_NATIVE_SIZE * zoomLevel;
  svgEl.style.width = size + 'px';
  svgEl.style.height = size + 'px';
  updateScrollSpacer();
}
function changeZoom(delta){
  zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomLevel + delta));
  applyZoom();
  centerOnJoinpoint();
}
function fitToScreen(){
  const vw = document.getElementById('canvas-wrap').clientWidth;
  const vh = document.getElementById('canvas-wrap').clientHeight;
  zoomLevel = Math.min(vw / SVG_NATIVE_SIZE, vh / SVG_NATIVE_SIZE) * 0.92;
  zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomLevel));
  applyZoom();
}

// تكبير بإصبعين (pinch) على الجوال — يؤثر فقط على المشجرة، لا على بقية عناصر الصفحة
(function(){
  const wrap = document.getElementById('canvas-wrap');
  let startDist = 0, startZoom = 1;
  function dist(t){
    const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.hypot(dx, dy);
  }
  wrap.addEventListener('touchstart', e => {
    if(e.touches.length === 2){
      startDist = dist(e.touches);
      startZoom = zoomLevel;
    }
  }, {passive:true});
  wrap.addEventListener('touchmove', e => {
    if(e.touches.length === 2){
      e.preventDefault();
      const newDist = dist(e.touches);
      zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, startZoom * (newDist/startDist)));
      applyZoom();
    }
  }, {passive:false});
})();

function toggleDrawer(){
  document.getElementById('panel').classList.toggle('open');
  document.getElementById('drawerToggle').classList.toggle('open');
}
function centerOnJoinpoint(startFromRight){
  const wrap = document.getElementById('canvas-wrap');
  if(startFromRight){
    wrap.scrollLeft = wrap.scrollWidth;   // نبدأ من أقصى اليمين
  }
  wrap.scrollLeft = (wrap.scrollWidth - wrap.clientWidth) / 2;
  wrap.scrollTop = (wrap.scrollHeight - wrap.clientHeight) / 2;
}
window.addEventListener('load', () => { fitToScreen(); setTimeout(() => centerOnJoinpoint(true), 50); });
window.addEventListener('resize', centerOnJoinpoint);

  document.getElementById('rotateWrap').style.transform = `rotate(${deg}deg)`;

});

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAefFnJFm6Utrl_2JuTDu648rZXBJ7bJgg",
  authDomain: "asmalfamilytree.firebaseapp.com",
  projectId: "asmalfamilytree",

  messagingSenderId: "233022414794",
  appId: "1:233022414794:web:0351d346d72b817b1cb933",
  measurementId: "G-5W6N75Q1PS"
};
firebase.initializeApp(firebaseConfig);
const pdb = firebase.firestore();
const _personCache = new Map(); // تفادي إعادة جلب نفس الشخص مرتين بنفس الجلسة

async function fetchPerson(pid){
  if (_personCache.has(pid)) return _personCache.get(pid);
  const doc = await pdb.collection('persons').doc(pid).get();
  const p = doc.exists ? Object.assign({ id: pid }, doc.data()) : null;
  _personCache.set(pid, p);
  return p;
}
async function fetchChildren(pid){
  const snap = await pdb.collection('persons').where('parentId', '==', pid).get();
  return snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
}
function firestorePersonInfoId(chainSlash){ return chainSlash.replace(/\//g, '__'); }
async function fetchPersonInfo(chainSlash){
  try{
    const doc = await pdb.collection('personInfo').doc(firestorePersonInfoId(chainSlash)).get();
    return doc.exists ? doc.data() : {};
  }catch(e){ return {}; }
}
// يبني سلسلة الأسماء (من الشخص نفسه صعودًا للجد الأول) بالاعتماد على ancestorIds
async function buildChainNames(person){
  const ids = (person.ancestorIds || [person.id]).slice().reverse();
  const names = [];
  for (const aid of ids){
    if (aid === person.id){ names.push(person.name); continue; }
    const p = await fetchPerson(aid);
    names.push(p ? p.name : '؟');
  }
  return names;
}
// علاقة قرابة مختصرة بين شخصين (نفس الفئات الست المستخدَمة بالموقع الرئيسي)
async function shortKinshipLabelByIds(aId, bId){
  if (aId === bId) return "";
  const a = await fetchPerson(aId), b = await fetchPerson(bId);
  if (!a || !b) return "";
  let aFather = null, bFather = null;
  if (a.parentId) aFather = await fetchPerson(a.parentId);
  if (b.parentId) bFather = await fetchPerson(b.parentId);
  if (a.parentId && b.parentId){
    if (a.parentId === b.parentId) return "أخ";
    if (aFather && aFather.parentId === b.parentId) return "عم";
    if (aFather && bFather && a.parentId !== b.parentId && aFather.parentId && aFather.parentId === bFather.parentId) return "ابن عم";
  }
  const aChain = (await buildChainNames(a)).join('/');
  const aInfo = await fetchPersonInfo(aChain);
  if (aInfo.mother && aInfo.mother.fatherId){
    if (b.parentId === aInfo.mother.fatherId) return "خال";
    if (bFather && bFather.parentId === aInfo.mother.fatherId) return "ابن خال";
  }
  if (aInfo.mother && aInfo.mother.wifeId){
    const bChain = (await buildChainNames(b)).join('/');
    const bInfo = await fetchPersonInfo(bChain);
    if (bInfo.mother && bInfo.mother.wifeId && aInfo.mother.wifeId === bInfo.mother.wifeId && a.parentId !== b.parentId) return "أخ لأم";
  }
  return "";
}

function piRow(label, value){
  return `<div class="pi-row"><span class="pi-label">${label}</span><span class="pi-value">${value}</span></div>`;
}

async function openPInfo(pid){
  const overlay = document.getElementById('pInfoOverlay');
  const loading = document.getElementById('pInfoLoading');
  const content = document.getElementById('pInfoContent');
  overlay.classList.add('show');
  loading.style.display = 'block'; content.style.display = 'none';

  try{
    const person = await fetchPerson(pid);
    if (!person){ loading.textContent = 'تعذّر إيجاد هذا الشخص.'; return; }
    const chainArr = await buildChainNames(person);
    const chainStr = chainArr.join('/');
    const data = await fetchPersonInfo(chainStr);

    document.getElementById('pInfoName').textContent = chainArr.slice(0, 5).join(' ');
    document.getElementById('pInfoChain').textContent = 'سلسلة النسب: ' + chainArr.join(' بن ');

    let html = '';
    html += piRow('الحالة', data.deathStatus === 'dead' ? 'متوفى' : 'حي يرزق');
    if (data.birthYear) html += piRow('تاريخ الميلاد', data.birthYear + ' هـ');
    if (data.job) html += piRow('الوظيفة', data.job);
    if (data.nickname) html += piRow('اللقب/الشهرة', data.nickname);

    const children = await fetchChildren(pid);
    const sons = children.filter(c => c.type !== 'female');
    html += piRow('عدد الأبناء بالمشجرة', String(sons.length));
    if (sons.length) html += piRow('أسماء الأبناء', sons.map(s => s.name).join('، '));

    // الأخوال (إخوة الأم) + الأعمام (إخوة الأب) — معًا بلا حاجة لمفتاح تبديل هنا
    if (data.mother && data.mother.fatherId){
      const uncles = (await fetchChildren(data.mother.fatherId)).filter(c => c.type !== 'female');
      if (uncles.length) html += piRow('الأخوال', uncles.map(u => u.name).join('، '));
    }
    if (person.parentId){
      const father = await fetchPerson(person.parentId);
      if (father && father.parentId){
        const pUncles = (await fetchChildren(father.parentId)).filter(c => c.type !== 'female' && c.id !== person.parentId);
        if (pUncles.length) html += piRow('الأعمام', pUncles.map(u => u.name).join('، '));
      }
    }

    // الأصهار
    const sadahaList = [];
    const insideWives = (data.wives || []).filter(w => w.type === 'inside' && w.fatherId);
    for (const w of insideWives){
      const wifeFather = await fetchPerson(w.fatherId);
      if (!wifeFather) continue;
      sadahaList.push({ label: 'والد الزوجة', node: wifeFather });
      const bros = (await fetchChildren(w.fatherId)).filter(c => c.type !== 'female');
      bros.forEach(b => sadahaList.push({ label: 'أخ زوجة', node: b }));
    }
    if (sadahaList.length){
      html += `<div class="pi-section-title">الأصهار</div>`;
      for (const s of sadahaList){
        const rel = await shortKinshipLabelByIds(pid, s.node.id);
        const sName = (await buildChainNames(s.node)).slice(0, 3).join(' بن ');
        html += `<div class="pi-sadaha-item"><b>${s.label}:</b> ${sName}${rel ? ` <span class="pi-rel">/ ${rel}</span>` : ''}</div>`;
      }
    }

    if (data.bio){
      html += `<div class="pi-section-title">النبذة التاريخية</div><div class="pi-bio">${data.bio.replace(/</g,'&lt;')}</div>`;
    }

    document.getElementById('pInfoBody').innerHTML = html;
    loading.style.display = 'none'; content.style.display = 'block';
  }catch(e){
    loading.textContent = 'تعذّر تحميل البيانات: ' + (e.message || e);
    console.error(e);
  }
}
function closePInfo(){ document.getElementById('pInfoOverlay').classList.remove('show'); }

// تفويض ضغط واحد على كل عناصر الأسماء/الدوائر التي تحمل data-pid (585 عقدة)
document.getElementById('mainsvg').addEventListener('click', (e) => {
  const el = e.target.closest('[data-pid]');
  if (!el) return;
  e.stopPropagation();
  openPInfo(el.getAttribute('data-pid'));
});
</script>
